<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Operaciones Basicas</h1>
    <script>
        let numero1= Number(prompt("Escribe el primer Numero"));
        let numero2= Number (prompt("Escribe el segundo Numero"));
        suma = numero1 + numero2;
        resta = numero1 - numero2;
        multiplicacion = numero1 * numero2;
        divicion = numero1 / numero2;
        document.write("la suma es:"+ suma +"<br>");
        document.write("la resta es:"+ resta +"<br>");
        document.write("la multiplicacion es:"+ multiplicacion +"<br>");
        document.write("la divicion es:"+ divicion +"<br>");
    </script>
    <a href="index.html" class="btn-inicio">Inicio</a>
</body>
</html>
