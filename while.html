<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo While</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Estructura While</h1>
    <script>
        
        let valor = 0;
        while (valor <= 5) {
            valor = Number(prompt("Escribe un número mayor a 5:"));
        }
        alert("¡Gracias! Ingresaste el número " + valor);
    </script>
    <a href="index.html" class="btn-inicio">Inicio</a>
</body>
</html>
